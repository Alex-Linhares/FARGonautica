# The slow suite (ANSWERS.md D2): the tests that take more than about two seconds on their
# own, or survey many seeds, moved out of tests/ so that the default suite stays fast. Run
# from python/ as `python3 -m pytest -q tests_slow` (or `bash run-tests.sh --slow`): pytest
# takes this file as its configuration when every argument is under tests_slow/, so the
# `-m 'not slow'` default of pyproject.toml does not apply here, and the helpers of tests/
# and tests/gui/ (sources.py, golden.py, the modules the tests were moved from) are found.
[pytest]
addopts = -p no:cacheprovider
pythonpath = .. ../tests ../tests/gui
markers =
    slow: a long multi-seed survey (tens of seconds or more); every test here carries it
xfail_strict = true
