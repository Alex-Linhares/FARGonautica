[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numbo"
version = "0.0.1"
description = "Numbo (Defays, 1987) translated to Python, test-driven against the SBCL port in ../src/"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["numbo"]

[tool.pytest.ini_options]
# Run from Software/Numbo/numbo-sbcl/ as `python3 -m pytest python/tests -q`, or from here.
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"
xfail_strict = true
